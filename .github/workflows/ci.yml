name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - run: sh tests/run.sh

  # Windows: validator, PowerShell installer tests, Git Bash parts of the suite, real OMP/OpenCode checks. See docs/WINDOWS.md.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install OMP
        run: |
          & ([scriptblock]::Create((irm https://omp.sh/install.ps1))) -Binary -Ref v18.15.0
          "$env:LOCALAPPDATA\omp" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install OpenCode
        run: npm install -g @opencode/cli@2.2.5
      - run: pwsh -NoProfile -File tests/run.ps1
      - run: pwsh -NoProfile -File tests/windows-ci-tools.ps1
