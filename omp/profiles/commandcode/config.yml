disabledProviders:
  - ollama
  - llama.cpp
  - lm-studio
defaultThinkingLevel: auto
modelRoles:
  smol: commandcode/deepseek/deepseek-v4.1-flash:low
  tiny: commandcode/deepseek/deepseek-v4.1-flash:low
  commit: commandcode/deepseek/deepseek-v4.1-flash:low
  default: commandcode/deepseek/deepseek-v4.1-flash:high
  task: commandcode/deepseek/deepseek-v4.1-flash:high
  execute: commandcode/deepseek/deepseek-v4.1-flash:high
  plan: commandcode/deepseek/deepseek-v4.1-flash:high
  vision: commandcode/deepseek/deepseek-v4.1-flash:high
  review_aux: commandcode/deepseek/deepseek-v4.1-flash:high
  slow: commandcode/zai-org/GLM-5.3:high
  critical: commandcode/zai-org/GLM-5.3:high
bash:
  patterns:
    - match: git push*
      approval: prompt
    - match: git -C * push*
      approval: prompt
    - match: git -c * push*
      approval: prompt
    - match: env * git push*
      approval: prompt
    - match: env * gh *
      approval: prompt
    - match: gh pr create*
      approval: prompt
    - match: gh pr merge*
      approval: prompt
    - match: gh pr review*
      approval: prompt
    - match: gh pr comment*
      approval: prompt
    - match: gh pr edit*
      approval: prompt
    - match: gh pr close*
      approval: prompt
    - match: gh pr ready*
      approval: prompt
    - match: gh pr reopen*
      approval: prompt
    - match: gh issue comment*
      approval: prompt
    - match: gh issue create*
      approval: prompt
    - match: gh issue close*
      approval: prompt
    - match: gh issue edit*
      approval: prompt
    - match: gh release create*
      approval: prompt
    - match: gh release edit*
      approval: prompt
    - match: gh release upload*
      approval: prompt
    - match: gh release delete*
      approval: prompt
    - match: gh repo edit*
      approval: prompt
    - match: gh repo delete*
      approval: prompt
    - match: gh secret set*
      approval: prompt
    - match: gh workflow run*
      approval: prompt
    - match: gh api -X*
      approval: prompt
    - match: gh api * -X*
      approval: prompt
    - match: gh api --method*
      approval: prompt
    - match: gh api * --method*
      approval: prompt
    - match: gh api -f*
      approval: prompt
    - match: gh api * -f*
      approval: prompt
    - match: gh api -F*
      approval: prompt
    - match: gh api * -F*
      approval: prompt
    - match: gh api --field*
      approval: prompt
    - match: gh api * --field*
      approval: prompt
    - match: gh api --raw-field*
      approval: prompt
    - match: gh api * --raw-field*
      approval: prompt
    - match: gh api --input*
      approval: prompt
    - match: gh api * --input*
      approval: prompt
    - match: "*.flow/runtime*"
      approval: prompt
task:
  maxConcurrency: 4
  maxRecursionDepth: 2
  enableEffort: false
  isolation:
    enabled: true
isolation:
  backend: auto
symbolPreset: nerd
composer:
  shape: rule
theme:
  dark: titanium
  light: light
setupVersion: 3
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - git
    - context_pct
  rightSegments:
    - session_name
    - usage
  separator: powerline-thin
  sessionAccent: true
  compactThinkingLevel: true
  contextLine: embedded
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
colorBlindMode: true
tui:
  codexResetFireworks: true
cycleOrder:
  - smol
  - default
  - slow
dev:
  autoqaConsent: denied
update:
  auto: true
